name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.23'
  GOPROXY: https://proxy.golang.org,direct
  CGO_ENABLED: '0'

jobs:

  verify:
    name: Build / Vet / Test
    runs-on: ubuntu-latest
    steps:

    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Show toolchain
      run: go version

    - name: Download dependencies
      run: go mod download

    # gui/ 依赖 fyne + OpenGL/X11 头文件，走桌面端构建流程，CI 不编译它
    - name: Build
      run: go build -trimpath ./bridge/... ./client/... ./lib/... ./server/... ./web/... ./cmd/...

    - name: Vet
      run: go vet ./bridge/... ./client/... ./lib/... ./server/... ./web/... ./cmd/...

    - name: Test
      run: go test -count=1 ./lib/... ./server/... ./client/... ./web/...

    # -race requires cgo, so it overrides the workflow-level CGO_ENABLED=0
    - name: Test with race detector
      env:
        CGO_ENABLED: '1'
      run: go test -race -count=1 ./lib/common ./lib/conn ./lib/file ./lib/pmux ./server/proxy

    - name: Build npc SDK (cgo, tag sdk)
      run: CGO_ENABLED=1 go build -tags sdk -buildmode=c-shared -o /tmp/npc_sdk.so ./cmd/npc/sdk.go

  cross-compile:
    name: Cross compile ${{ matrix.goos }}/${{ matrix.goarch }}${{ matrix.goarm }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: '386'
          - goos: linux
            goarch: arm
            goarm: '6'
          - goos: linux
            goarch: arm
            goarm: '7'
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: mipsle
          - goos: linux
            goarch: mips64le
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: '386'
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: freebsd
            goarch: amd64
    steps:

    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Build server and client
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        GOARM: ${{ matrix.goarm }}
      run: |
        go build -trimpath -ldflags '-s -w' -o /tmp/nps ./cmd/nps
        go build -trimpath -ldflags '-s -w' -o /tmp/npc ./cmd/npc
        ls -l /tmp/nps /tmp/npc
